name: PR validation

on:
  pull_request:
    branches:
      - main
      - "preview/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
  TF_VAR_workload: ${{ vars.WORKLOAD }}
  TF_VAR_unique_suffix: ${{ vars.UNIQUE_SUFFIX }}
  TF_IN_AUTOMATION: "true"
  TF_DIR: infra/environments/app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet build SupportAgent.slnx -c Release

  terraform-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - run: terraform fmt -check -recursive infra

      - name: terraform validate
        run: |
          for stack in infra/shared infra/environments/app; do
            terraform -chdir="$stack" init -backend=false -input=false > /dev/null
            terraform -chdir="$stack" validate
          done

  plan:
    # Sem "environment": o token OIDC usa o subject repo:<owner>/<repo>:pull_request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: env
        uses: ./.github/actions/resolve-environment

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: terraform plan (${{ steps.env.outputs.env-key }})
        run: |
          scripts/tf-init.sh "$TF_DIR" "${{ steps.env.outputs.state-key }}"
          terraform -chdir="$TF_DIR" plan -input=false -lock=false -no-color \
            -var "env_key=${{ steps.env.outputs.env-key }}" \
            -var "branch=${{ steps.env.outputs.branch }}" \
            -var "created_by=${{ github.actor }}" \
            -out=tfplan > "$RUNNER_TEMP/plan.txt"
          terraform -chdir="$TF_DIR" show -no-color tfplan | grep -E '^Plan:|No changes' > "$RUNNER_TEMP/plan-summary.txt" || true

      - name: Comentar no PR
        env:
          GH_TOKEN: ${{ github.token }}
          ENV_KEY: ${{ steps.env.outputs.env-key }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          {
            echo "### Ambiente de destino: \`$ENV_KEY\`"
            echo ""
            echo "**Terraform:** $(cat "$RUNNER_TEMP/plan-summary.txt" || echo 'ver log')"
            echo ""
            echo "**Mudanças no agente (prompt/base de conhecimento):**"
            echo '```'
            git diff --stat "origin/$BASE_REF...HEAD" -- agent/ || true
            echo '```'
            echo "<details><summary>Plano completo</summary>"
            echo ""
            echo '```'
            tail -c 60000 "$RUNNER_TEMP/plan.txt"
            echo '```'
            echo "</details>"
          } > "$RUNNER_TEMP/comment.md"

          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --body-file "$RUNNER_TEMP/comment.md" \
            || gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/comment.md"
