name: Deploy

run-name: Deploy ${{ inputs.env_key || github.ref_name }}

on:
  push:
    branches:
      - main
      - "preview/**"
    paths-ignore:
      - README.md
      - ".github/prompts/**"
      - ".vscode/**"
  workflow_dispatch:
    inputs:
      env_key:
        description: Chave do ambiente (main ou a chave do preview)
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.env_key || github.ref_name }}
  cancel-in-progress: false

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
  TF_VAR_workload: ${{ vars.WORKLOAD }}
  TF_VAR_unique_suffix: ${{ vars.UNIQUE_SUFFIX }}
  TF_IN_AUTOMATION: "true"
  TF_DIR: infra/environments/app

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      env-key: ${{ steps.env.outputs.env-key }}
      env-type: ${{ steps.env.outputs.env-type }}
      branch: ${{ steps.env.outputs.branch }}
      state-key: ${{ steps.env.outputs.state-key }}
    steps:
      - uses: actions/checkout@v4

      - id: env
        uses: ./.github/actions/resolve-environment
        with:
          env-key: ${{ inputs.env_key }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: dotnet publish
        run: dotnet publish src/SupportAgent.Web -c Release -o "$RUNNER_TEMP/web"

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: ${{ runner.temp }}/web
          retention-days: 3

  deploy:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve.outputs.env-type }}
      url: ${{ steps.tf.outputs.web_app_url }}
    env:
      ENV_KEY: ${{ needs.resolve.outputs.env-key }}
      BRANCH: ${{ needs.resolve.outputs.branch }}
      STATE_KEY: ${{ needs.resolve.outputs.state-key }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # A branch decide QUAL ambiente recebe a infra: a chave do state vem dela.
      - name: terraform init (state ${{ env.STATE_KEY }})
        run: scripts/tf-init.sh "$TF_DIR" "$STATE_KEY"

      - name: terraform apply
        run: |
          terraform -chdir="$TF_DIR" apply -auto-approve -input=false \
            -var "env_key=$ENV_KEY" \
            -var "branch=$BRANCH" \
            -var "created_by=${{ github.actor }}"

      - id: tf
        name: Ler outputs
        run: |
          terraform -chdir="$TF_DIR" output -json > "$RUNNER_TEMP/outputs.json"
          for k in web_app_name web_app_url foundry_project_endpoint; do
            echo "$k=$(jq -r ".$k.value" "$RUNNER_TEMP/outputs.json")" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: ${{ runner.temp }}/web

      - name: Deploy da Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.tf.outputs.web_app_name }}
          package: ${{ runner.temp }}/web

      # O prompt do agente e a base de conhecimento também são "deployados" por ambiente.
      - name: Publicar agente e base de conhecimento
        run: |
          dotnet run --project src/SupportAgent.AgentSync -c Release -- sync \
            --endpoint "${{ steps.tf.outputs.foundry_project_endpoint }}" \
            --env-key "$ENV_KEY" \
            --agent-dir agent

      - name: Smoke test
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 10 --retry-all-errors \
            "${{ steps.tf.outputs.web_app_url }}/healthz"

      - name: Resumo
        run: |
          {
            echo "## Deploy em \`$ENV_KEY\`"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- App: ${{ steps.tf.outputs.web_app_url }}"
            echo "- Projeto Foundry: ${{ steps.tf.outputs.foundry_project_endpoint }}"
          } >> "$GITHUB_STEP_SUMMARY"
